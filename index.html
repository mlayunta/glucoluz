<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d9488">
<meta name="description" content="GlucoLuz — PWA de apoyo a la diabetes tipo 1 y tipo 2: conteo de hidratos, calculador de bolo, TIR, panel metabólico e informes AGP. Autor: Miguel Ángel Layunta López.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GlucoLuz">
<title>GlucoLuz · Diabetes</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#f4f7fa; --card:#ffffff; --ink:#0b1220; --muted:#64748b; --line:#e5ebf3;
  --brand:#0d9488; --brand-d:#0f766e; --brand-l:#ccfbf1; --accent:#6366f1;
  --low:#dc2626; --inr:#16a34a; --high:#f59e0b; --vhigh:#ea580c;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 30px -18px rgba(15,23,42,.35);
  --r:20px;
}
[data-theme="dark"]{
  --bg:#0a1120; --card:#111a2b; --ink:#e8eef8; --muted:#93a3b8; --line:#1e2a3f;
  --brand:#2dd4bf; --brand-d:#14b8a6; --brand-l:#0f2f2c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em;font-weight:700}
p{margin:0}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font-family:inherit;font-size:15px;color:var(--ink)}
a{color:inherit}
::selection{background:var(--brand-l)}

/* ---------- TOPBAR ---------- */
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:38px;height:38px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(140deg,#14b8a6,#0f766e);color:#fff;
  box-shadow:0 6px 16px -6px rgba(13,148,136,.8);
}
.brand h1{font-size:17px;line-height:1.1}
.brand p{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.top-actions{display:flex;gap:8px}
.icon-btn{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:var(--card);border:1px solid var(--line);color:var(--muted);transition:.15s;
}
.icon-btn:active{transform:scale(.94)}

/* ---------- LAYOUT ---------- */
main{padding:16px 14px 120px;max-width:760px;margin:0 auto}
.page{display:flex;flex-direction:column;gap:14px;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-h h2{font-size:23px}
.page-h p{font-size:13px;color:var(--muted);margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.tight{padding:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.sep{height:1px;background:var(--line);margin:12px 0}
.ok{color:var(--inr)} .warn{color:var(--high)} .bad{color:var(--low)}

/* ---------- HERO ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:26px;padding:20px;color:#fff;
  background:linear-gradient(135deg,#0d9488,#0f766e 58%,#115e59);
  box-shadow:0 18px 40px -22px rgba(13,148,136,.9);
}
.hero.warn{background:linear-gradient(135deg,#f59e0b,#d97706 60%,#b45309);box-shadow:0 18px 40px -22px rgba(217,119,6,.9)}
.hero.danger{background:linear-gradient(135deg,#ef4444,#dc2626 60%,#991b1b);box-shadow:0 18px 40px -22px rgba(220,38,38,.9)}
.hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.22),transparent 68%);top:-90px;right:-70px}
.hero-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:.9;font-weight:600}
.hero-val{font-size:62px;font-weight:800;letter-spacing:-.045em;line-height:1;margin:10px 0 2px;display:flex;align-items:baseline;gap:8px}
.hero-val small{font-size:15px;font-weight:600;opacity:.85;letter-spacing:0}
.hero-sub{font-size:13px;opacity:.92;font-weight:600}
.hero-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hero-actions button{
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);color:#fff;
  padding:9px 14px;border-radius:12px;font-size:13px;font-weight:700;backdrop-filter:blur(6px);
}
.hero-actions button:active{transform:scale(.97)}
.pill{background:rgba(255,255,255,.18);padding:3px 9px;border-radius:99px;font-size:11px}

/* ---------- QUICK ---------- */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 4px;
  display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted);
  box-shadow:var(--shadow);transition:.15s;
}
.quick button:active{transform:scale(.96)}
.quick svg{color:var(--brand)}

/* ---------- CHIPS / BUTTONS ---------- */
.chip{
  padding:8px 14px;border-radius:99px;font-size:13px;font-weight:700;
  background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap;transition:.15s;
}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 6px 16px -8px rgba(13,148,136,.9)}
.chip.sm{padding:6px 11px;font-size:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 18px;border-radius:14px;font-weight:700;font-size:14px;
  background:var(--card);border:1px solid var(--line);color:var(--ink);transition:.15s;width:100%;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:linear-gradient(135deg,#14b8a6,#0f766e);color:#fff;border:0;box-shadow:0 12px 26px -14px rgba(13,148,136,.95)}
.btn.ghost{background:transparent}
.btn.danger{color:#fff;background:linear-gradient(135deg,#ef4444,#b91c1c);border:0}
.btn.sm{padding:9px 14px;font-size:13px;width:auto;border-radius:11px}

/* ---------- FIELDS ---------- */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.input{
  width:100%;padding:12px 13px;border-radius:13px;border:1px solid var(--line);
  background:var(--bg);outline:none;transition:.15s;font-weight:600;
}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* ---------- FOOD LIST ---------- */
.search{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.search input{flex:1;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:var(--bg);outline:none;font-weight:600}
.search input:focus{border-color:var(--brand)}
.foodlist{max-height:330px;overflow-y:auto;margin-top:10px;border-radius:14px}
.food{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.food:last-child{border-bottom:0}
.food .nm{flex:1;min-width:0}
.food .nm b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.food .nm span{font-size:11.5px;color:var(--muted)}
.gi{font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;letter-spacing:.02em}
.gi.lo{background:#dcfce7;color:#15803d}
.gi.md{background:#fef3c7;color:#b45309}
.gi.hi{background:#fee2e2;color:#b91c1c}
.gi.na{background:var(--line);color:var(--muted)}
[data-theme="dark"] .gi.lo{background:#052e16;color:#4ade80}
[data-theme="dark"] .gi.md{background:#3b2a06;color:#fbbf24}
[data-theme="dark"] .gi.hi{background:#3f0d0d;color:#f87171}
.add{width:32px;height:32px;border-radius:10px;background:var(--brand-l);color:var(--brand-d);display:grid;place-items:center;font-size:19px;font-weight:800;flex:none}
.add:active{transform:scale(.9)}

/* ---------- CART ---------- */
.cart-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.cart-item:last-of-type{border-bottom:0}
.cart-item .nm{flex:1;min-width:0;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item input{width:64px;padding:7px 8px;border-radius:9px;border:1px solid var(--line);background:var(--bg);text-align:center;font-weight:700;font-size:13px}
.del{color:var(--muted);font-size:17px;padding:0 4px}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tot{background:var(--bg);border-radius:14px;padding:10px;text-align:center;border:1px solid var(--line)}
.tot b{display:block;font-size:19px;letter-spacing:-.03em}
.tot span{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}

/* ---------- BOLUS ---------- */
.bolus{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 12%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--brand) 30%,var(--line))}
.bolus-out{margin-top:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);padding:12px;display:none}
.bolus-out.show{display:block;animation:fade .25s}
.brow{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;font-weight:600}
.brow.total{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-size:16px;font-weight:800}
.alert{display:flex;gap:8px;padding:10px 12px;border-radius:12px;font-size:12.5px;font-weight:600;margin-top:10px;line-height:1.45}
.alert.w{background:#fef3c7;color:#92400e}
.alert.d{background:#fee2e2;color:#991b1b}
.alert.i{background:#e0f2fe;color:#075985}
.alert.g{background:#dcfce7;color:#166534}
[data-theme="dark"] .alert.w{background:#3b2a06;color:#fcd34d}
[data-theme="dark"] .alert.d{background:#3f0d0d;color:#fca5a5}
[data-theme="dark"] .alert.i{background:#082f49;color:#7dd3fc}
[data-theme="dark"] .alert.g{background:#052e16;color:#86efac}
.locked{text-align:center;padding:6px 0}
.locked .lk{font-size:26px;margin-bottom:6px}

/* ---------- TIMELINE ---------- */
.tl{display:flex;flex-direction:column;gap:8px}
.tl-item{display:flex;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 13px;box-shadow:var(--shadow)}
.tl-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;font-size:16px;background:var(--bg)}
.tl-b{flex:1;min-width:0}
.tl-b b{font-size:13.5px;display:block}
.tl-b span{font-size:11.5px;color:var(--muted)}
.tl-v{font-weight:800;font-size:15px;text-align:right;flex:none}

/* ---------- STATS ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.stat b{display:block;font-size:20px;letter-spacing:-.03em}
.stat span{font-size:11px;color:var(--muted);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.legend div{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:3px}
.donut-wrap{position:relative;display:grid;place-items:center}
.donut-c{position:absolute;text-align:center}
.donut-c b{display:block;font-size:26px;letter-spacing:-.04em;line-height:1}
.donut-c span{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.05em}

/* ---------- MÉTRICAS / SEMÁFORO ---------- */
.metric-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.metric-row:last-child{border-bottom:0}
.metric-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:17px;background:var(--bg);flex:none}
.metric-b{flex:1;min-width:0}
.metric-b b{font-size:13.5px;display:block}
.metric-b span{font-size:11.5px;color:var(--muted)}
.metric-v{text-align:right;font-weight:800;font-size:15px;flex:none}
.metric-v small{display:block;font-size:10px;font-weight:700;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .4s}
.screen-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.screen-item:last-child{border-bottom:0}
.screen-item .si{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--bg);font-size:15px;flex:none}
.screen-item .sb{flex:1;min-width:0}
.screen-item b{font-size:13px;display:block}
.screen-item span{font-size:11px;color:var(--muted)}
.tag{font-size:10px;font-weight:800;padding:3px 8px;border-radius:99px}
.tag.ok{background:#dcfce7;color:#15803d}
.tag.warn{background:#fef3c7;color:#b45309}
.tag.bad{background:#fee2e2;color:#b91c1c}
[data-theme="dark"] .tag.ok{background:#052e16;color:#4ade80}
[data-theme="dark"] .tag.warn{background:#3b2a06;color:#fbbf24}
[data-theme="dark"] .tag.bad{background:#3f0d0d;color:#f87171}

/* ---------- CONSEJOS ---------- */
.link-card{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-decoration:none;box-shadow:var(--shadow);margin-bottom:8px;transition:.15s}
.link-card:active{transform:scale(.985)}
.link-card .lc{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:var(--brand-l);flex:none}
.link-card b{font-size:13.5px;display:block}
.link-card span{font-size:11.5px;color:var(--muted);display:block;line-height:1.4}
.link-card .go{color:var(--muted);font-size:15px;flex:none}
.cat-h{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:6px 0 8px}

/* ---------- TABBAR ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--card) 90%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--line);
}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;font-weight:700;color:var(--muted);padding:4px 5px;border-radius:12px;transition:.15s;flex:1;min-width:0}
.tab.on{color:var(--brand)}
.tab:active{transform:scale(.94)}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* ---------- MODAL ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(8,15,28,.5);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;max-height:88vh;overflow-y:auto;animation:up .28s cubic-bezier(.2,.9,.3,1);padding-bottom:env(safe-area-inset-bottom)}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px;position:sticky;top:0;background:var(--card);z-index:2}
.sheet-h h3{font-size:17px}
.sheet-b{padding:6px 18px 18px}
.sheet-f{padding:0 18px 18px;display:flex;gap:8px}

/* ---------- ONBOARDING ---------- */
.onb{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 20px 40px;max-width:520px;margin:0 auto;gap:18px;animation:fade .35s}
.onb-logo{width:74px;height:74px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(140deg,#14b8a6,#0f766e);color:#fff;box-shadow:0 20px 40px -18px rgba(13,148,136,.9)}
.onb h1{font-size:34px;letter-spacing:-.04em}
.onb .lead{font-size:15px;color:var(--muted);line-height:1.55}
.feat{display:flex;gap:11px;align-items:flex-start}
.feat .fi{width:34px;height:34px;border-radius:11px;background:var(--brand-l);color:var(--brand-d);display:grid;place-items:center;flex:none;font-size:15px}
.feat b{font-size:13.5px;display:block}
.feat span{font-size:12px;color:var(--muted)}
.typecard{display:flex;gap:12px;align-items:center;padding:15px;border-radius:18px;border:2px solid var(--line);background:var(--card);text-align:left;width:100%;transition:.15s}
.typecard.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--card))}
.typecard .tc{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--brand-l);color:var(--brand-d);flex:none}
.typecard b{font-size:14.5px;display:block}
.typecard span{font-size:12px;color:var(--muted);line-height:1.4;display:block}
.author{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.6}

/* ---------- MISC ---------- */
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#0b1220;color:#fff;padding:11px 18px;border-radius:14px;font-size:13px;font-weight:700;z-index:200;opacity:0;transition:.28s;pointer-events:none;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.chart{width:100%;height:auto;display:block}
.switch{position:relative;width:48px;height:28px;border-radius:99px;background:var(--line);transition:.2s;flex:none}
.switch.on{background:var(--brand)}
.switch::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on::after{left:23px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row b{font-size:13.5px;display:block}
.set-row span{font-size:11.5px;color:var(--muted);display:block;line-height:1.4}
.banner{display:flex;gap:10px;align-items:center;background:#fef3c7;color:#92400e;padding:10px 13px;border-radius:14px;font-size:12px;font-weight:700}
[data-theme="dark"] .banner{background:#3b2a06;color:#fcd34d}
.banner button{margin-left:auto;font-size:11px;text-decoration:underline;color:inherit;font-weight:800}
.edu{display:flex;flex-direction:column;gap:8px}
.edu-item{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 13px;text-align:left;width:100%}
.edu-item b{font-size:13.5px;display:block;margin-bottom:3px}
.edu-item span{font-size:12px;color:var(--muted);line-height:1.5}
.plate{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.racion{width:26px;height:26px;border-radius:8px;background:var(--brand-l);border:1px solid color-mix(in srgb,var(--brand) 35%,transparent);display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--brand-d)}
.fav{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.fav::-webkit-scrollbar{display:none}
.fav button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 13px;font-size:12.5px;font-weight:700;white-space:nowrap;box-shadow:var(--shadow);color:var(--ink)}
.fav button:active{transform:scale(.96)}
.streak{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border-radius:18px;padding:14px 16px}
.streak b{font-size:26px;letter-spacing:-.03em;line-height:1}
.streak span{font-size:11.5px;opacity:.92;font-weight:600;display:block}
  /* ---------- ETIQUETADO Y EDULCORANTES ---------- */
  .nutri-row{padding:11px 0;border-bottom:1px solid var(--line)}
  .nutri-row:last-of-type{border-bottom:0}
  .nutri-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:7px}
  .nutri-h span:first-child{font-size:13.5px;font-weight:700}
  .nutri-t{display:flex;gap:6px;flex-wrap:wrap}
  .nutri-t .tag{flex:1;text-align:center;padding:5px 6px;font-size:10.5px;min-width:72px}
  .sw-group{font-size:12px;font-weight:800;margin:14px 0 2px;letter-spacing:.02em}
  .sw-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
  .sw-row:last-child{border-bottom:0}
  .sw-dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px}
  .sw-dot.ok{background:var(--inr)}
  .sw-dot.mid{background:var(--high)}
  .sw-dot.bad{background:var(--low)}
  .sw-b{flex:1;min-width:0}
  .sw-b b{font-size:13px;display:block}
  .sw-b b i{font-style:normal;font-size:10.5px;color:var(--muted);font-weight:700}
  .sw-b span{font-size:11.5px;color:var(--muted);line-height:1.45;display:block}
  .steps{display:flex;flex-direction:column;gap:9px}
  .step{display:flex;gap:10px;align-items:flex-start}
  .step .sn{width:24px;height:24px;border-radius:8px;background:var(--brand-l);color:var(--brand-d);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
  .step b{font-size:13px;display:block}
  .step span{font-size:12px;color:var(--muted);line-height:1.5;display:block}
  /* ---------- ESCÁNER ---------- */
  .scan-wrap{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:4/3;margin-bottom:12px}
  .scan-wrap video{width:100%;height:100%;object-fit:cover;display:block}
  .scan-frame{position:absolute;inset:16% 7%;border:3px solid rgba(255,255,255,.92);border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.38)}
  .scan-line{position:absolute;left:7%;right:7%;height:2px;background:#2dd4bf;box-shadow:0 0 14px #2dd4bf;animation:scanmove 2.2s ease-in-out infinite}
  @keyframes scanmove{0%,100%{top:18%}50%{top:80%}}
  .prod-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
  .prod-img{width:64px;height:64px;border-radius:14px;object-fit:cover;background:var(--bg);flex:none;border:1px solid var(--line)}
  .ns-badge{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;flex:none}
  .nutri-line{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .nutri-line:last-child{border-bottom:0}
  .tag.na{background:var(--line);color:var(--muted)}
  /* ---------- SELECTOR SEGMENTADO ---------- */
  .seg{display:flex;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
  .seg-b{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:700;padding:9px 6px;border-radius:9px;cursor:pointer;transition:.15s}
  .seg-b.on{background:var(--brand);color:#fff}
  .seg-b:not(.on):hover{color:var(--txt)}

/* ---------- PRINT ---------- */
#printArea{display:none}
@media print{
  body{background:#fff}
  #app,.tabbar,.topbar,.toast{display:none!important}
  #printArea{display:block!important;padding:0;color:#000}
  .pr-page{page-break-after:always}

  .pr-h h1{font-size:20px;color:#0f766e}
  .pr-h p{font-size:11px;color:#555}
  .pr-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
  .pr-cell{border:1px solid #ddd;border-radius:8px;padding:8px;text-align:center}
  .pr-cell b{display:block;font-size:16px}
  .pr-cell span{font-size:9px;color:#666;text-transform:uppercase}
  .pr-foot{margin-top:16px;font-size:9px;color:#666;border-top:1px solid #ddd;padding-top:8px;line-height:1.5}
}

function trendOf(rs) {
  if (rs.length < 2) return { arrow: '→', label: 'Sin tendencia', rate: 0 };
  const a = rs[rs.length - 2], b = rs[rs.length - 1];
  const dt = (b.t - a.t) / 60000;
  if (dt <= 0 || dt > 90) return { arrow: '→', label: 'Sin datos recientes', rate: 0 };
  const rate = (b.v - a.v) / dt;
  let arrow = '→', label = 'Estable';
  if (rate > 2) { arrow = '↑↑'; label = 'Subiendo rápido'; }
  else if (rate > 1) { arrow = '↑'; label = 'Subiendo'; }
  else if (rate > 0.3) { arrow = '↗'; label = 'Subiendo despacio'; }
  else if (rate < -2) { arrow = '↓↓'; label = 'Bajando rápido'; }
  else if (rate < -1) { arrow = '↓'; label = 'Bajando'; }
  else if (rate < -0.3) { arrow = '↘'; label = 'Bajando despacio'; }
  return { arrow, label, rate };
}

function tirStats(rs, days) {
  days = days || 14;
  const cut = Date.now() - days * 864e5;
  const v = rs.filter(r => r.t >= cut).map(r => r.v);
  const n = v.length;
  if (!n) return { n: 0, mean: 0, gmi: 0, cv: 0, vlow: 0, low: 0, inr: 0, high: 0, vhigh: 0 };
  const mean = v.reduce((a, b) => a + b, 0) / n;
  const sd = Math.sqrt(v.reduce((a, b) => a + (b - mean) ** 2, 0) / n);
  const c = f => v.filter(f).length / n * 100;
  return {
    n, mean: Math.round(mean),
    gmi: +(3.31 + 0.02392 * mean).toFixed(1),
    cv: Math.round(sd / mean * 100),
    vlow: c(x => x < 54), low: c(x => x >= 54 && x < 70),
    inr: c(x => x >= 70 && x <= 180), high: c(x => x > 180 && x <= 250), vhigh: c(x => x > 250)
  };
}

function seriesChart(series, opts) {
  opts = opts || {};
  const W = opts.W || 720, H = opts.H || 240;
  const padL = 46, padR = 16, padT = 16, padB = 30;
  const all = [];
  series.forEach(s => s.points.forEach(pt => all.push(pt)));
  if (!all.length) return '<div class="muted small" style="padding:26px;text-align:center">Sin datos suficientes todavía.</div>';

  let v0 = Math.min.apply(null, vs), v1 = Math.max.apply(null, vs);
  const pad = (v1 - v0) * 0.18 || 2;

  const X = t => padL + ((t - t0) / ((t1 - t0) || 1)) * (W - padL - padR);

  });
  for (let h = 0; h <= 24; h += 3) {
    g += '<line x1="' + X(h) + '" y1="' + padT + '" x2="' + X(h) + '" y2="' + (H - padB) + '" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/>';
    g += '<text x="' + X(h) + '" y="' + (H - padB + 15) + '" text-anchor="middle" font-size="10" fill="var(--muted)" font-weight="700">' + (h === 24 ? '24h' : h + 'h') + '</text>';
  }
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart">' +
    '<rect x="' + padL + '" y="' + Y(180) + '" width="' + (W - padL - padR) + '" height="' + (Y(70) - Y(180)) + '" fill="#16a34a" opacity="0.07"/>' +
    g +
    '<path d="' + band('p5', 'p95') + '" fill="#0d9488" opacity="0.13"/>' +
    '<path d="' + band('p25', 'p75') + '" fill="#0d9488" opacity="0.28"/>' +
    '<path d="' + med + '" fill="none" stroke="#0f766e" stroke-width="2.6" stroke-linejoin="round"/>' +
    '<text x="' + (W - padR) + '" y="' + (padT + 12) + '" text-anchor="end" font-size="10" fill="var(--muted)" font-weight="700">Percentiles 5–95 · 25–75 · mediana</text>' +
    '</svg>';
}

function dayChartSVG(W, H) {
  W = W || 720; H = H || 250;
  const padL = 42, padR = 14, padT = 16, padB = 28;
  const now = Date.now(), start = now - 24 * 3600e3;
  const rs = S.glucose.filter(r => r.t >= start).sort((a, b) => a.t - b.t);
  const X = t => padL + ((t - start) / (24 * 3600e3)) * (W - padL - padR);
  const Y = v => padT + (1 - (clamp(v, 40, 400) - 40) / 360) * (H - padT - padB);
  let g = '';
  [40, 70, 180, 250, 400].forEach(v => {
    g += '<line x1="' + padL + '" y1="' + Y(v) + '" x2="' + (W - padR) + '" y2="' + Y(v) + '" stroke="var(--line)" stroke-width="1"/>';
    g += '<text x="' + (padL - 7) + '" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="10" fill="var(--muted)" font-weight="700">' + v + '</text>';
  });
  for (let h = 0; h <= 24; h += 6) {
    const t = start + h * 3600e3;
    g += '<text x="' + X(t) + '" y="' + (H - padB + 14) + '" text-anchor="middle" font-size="10" fill="var(--muted)" font-weight="700">' + fmtTime(t) + '</text>';
  }
  let line = '', dots = '';
  rs.forEach((r, i) => {
    line += (i ? 'L' : 'M') + X(r.t).toFixed(1) + ' ' + Y(r.v).toFixed(1);
    dots += '<circle cx="' + X(r.t).toFixed(1) + '" cy="' + Y(r.v).toFixed(1) + '" r="3.2" fill="' + bgColor(r.v) + '"/>';
  });
  let ev = '';
  S.events.filter(e => e.t >= start).forEach(e => {
    ev += '<line x1="' + X(e.t) + '" y1="' + padT + '" x2="' + X(e.t) + '" y2="' + (H - padB) + '" stroke="#6366f1" stroke-width="1.4" stroke-dasharray="3 3" opacity=".7"/>';
    ev += '<text x="' + X(e.t) + '" y="' + (padT - 4) + '" text-anchor="middle" font-size="11">' + (e.emoji || '•') + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart">' +
    '<rect x="' + padL + '" y="' + Y(180) + '" width="' + (W - padL - padR) + '" height="' + (Y(70) - Y(180)) + '" fill="#16a34a" opacity="0.07"/>' +
    g + ev +
    (rs.length ? '<path d="' + line + '" fill="none" stroke="#0d9488" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>' + dots
      : '<text x="' + W / 2 + '" y="' + H / 2 + '" text-anchor="middle" font-size="12" fill="var(--muted)">Sin lecturas en las últimas 24 h</text>') +
    '</svg>';
}

function plateSVG() {
  const segs = [{ v: 50, c: '#16a34a' }, { v: 25, c: '#f59e0b' }, { v: 25, c: '#0d9488' }];
  return '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">' +
    '<div class="donut-wrap">' + donut(segs, 128, 26) +
    '<div class="donut-c"><b style="font-size:15px">50%</b><span>VERDURAS</span></div></div>' +

}

/* ---------------- DATOS DE DEMOSTRACIÓN ---------------- */
function seedDemo() {
  const now = new Date();
  const g = [], meals = [], ev = [], met = [];
  const slots = ['desayuno', 'comida', 'cena'];
  for (let d = 89; d >= 0; d--) {
    const day = new Date(now); day.setDate(now.getDate() - d); day.setHours(0, 0, 0, 0);
    const base = day.getTime();
    if (d < 14) {
      for (let h = 0; h < 24; h += 2) {
        let b = 112;
        if (h >= 1 && h <= 4) b = 98;
        if (h === 8) b = 168; if (h === 10) b = 148;
        if (h === 14) b = 178; if (h === 16) b = 152;
        if (h === 21) b = 170; if (h === 23) b = 138;
        const v = clamp(Math.round(b + (Math.random() * 44 - 22)), 58, 290);
        g.push({ id: uid(), t: base + h * 3600e3 + Math.floor(Math.random() * 30) * 60000, v, tag: 'auto' });
      }
      slots.forEach((s, i) => {
        const carbs = Math.round(35 + Math.random() * 40);
        meals.push({
          id: uid(), t: base + (i === 0 ? 8 : i === 1 ? 14 : 21) * 3600e3,
          slot: s, carbs, load: +(carbs * 0.55).toFixed(1), gi: 55, bolus: +(carbs / 10).toFixed(1), items: []
        });
      });
      if (d % 3 === 0) ev.push({ id: uid(), t: base + 18 * 3600e3, type: 'ejercicio', emoji: '🏃', note: 'Caminata 40 min (aeróbico)' });
      if (d % 5 === 0) ev.push({ id: uid(), t: base + 11 * 3600e3, type: 'estrés', emoji: '😰', note: 'Reunión tensa en el trabajo' });
    }
    if (d % 7 === 0) {
      met.push({
        id: uid(), t: base + 8 * 3600e3,
        weight: +(82 - (89 - d) * 0.045 + Math.random() * 0.4).toFixed(1),
        waist: Math.round(98 - (89 - d) * 0.06),
        sys: Math.round(136 - (89 - d) * 0.08 + Math.random() * 4),
        dia: Math.round(84 - (89 - d) * 0.05 + Math.random() * 3)
      });
    }
  }
  S.glucose = g; S.meals = meals; S.events = ev; S.metrics = met;
  S.meds = [
    { id: uid(), name: 'Metformina', dose: '850 mg', time: '08:00', on: true },
    { id: uid(), name: 'Empagliflozina', dose: '10 mg', time: '08:00', on: true }
  ];
  S.screening = { eye: Date.now() - 400 * 864e5, kidney: Date.now() - 120 * 864e5, foot: Date.now() - 200 * 864e5, lipids: Date.now() - 90 * 864e5 };
  S.demo = true;
}

  removeItem(i) { this.cart.splice(i, 1); this.refreshCart(); },

    cartTotals() {
      let carbs = 0, load = 0, unknownGi = false;
      this.cart.forEach(c => {
        const f = foodById(c.id);
        if (!f) return;
        const g = c.g / 100;
        carbs += f.c * g;
        if (f.gi >= 0) load += f.gi * f.c * g / 100;
        else { load += 55 * f.c * g / 100; unknownGi = true; }
      });
      const gi = carbs > 0 ? (load / carbs * 100) : 0;
      return { carbs: +carbs.toFixed(1), load: +load.toFixed(1), gi: Math.round(gi), unknownGi };
    },

    cartHTML() {
      const p = S.profile;

  calcBolus() {
    const p = S.profile;
    const t = this.cartTotals();
    const bg = parseFloat(($('#bgNow') || {}).value);
    const iob = parseFloat(($('#iobNow') || {}).value) || 0;
    const icr = p.icr[this.slot] || 10;
    const carbBolus = t.carbs / icr;
    let corr = 0, warn = '';
    if (!isNaN(bg) && bg > p.targetBG) corr = (bg - p.targetBG) / p.isf;
    let total = Math.max(0, carbBolus + corr - iob);
    const step = p.roundStep || 0.5;
    total = Math.round(total / step) * step;

    if (!isNaN(bg) && bg < 70) {
      warn = '<div class="alert d">⚠️ Glucemia por debajo de 70 mg/dL. Trata la hipoglucemia primero (regla 15-15) y no administres bolo de corrección.</div>';
      total = 0;
    } else if (total > 15) {
      warn = '<div class="alert w">⚠️ Dosis elevada. Revisa los datos con tu equipo sanitario antes de administrarla.</div>';
    }

    this.lastBolus = total;
    const out = $('#bolusOut');
    out.innerHTML =
      '<div class="brow"><span class="muted">Hidratos (' + t.carbs + ' g ÷ ' + icr + ')</span><b>' + carbBolus.toFixed(1) + ' U</b></div>' +
      '<div class="brow"><span class="muted">Corrección (' + (isNaN(bg) ? '—' : bg + ' → ' + p.targetBG) + ')</span><b>' + corr.toFixed(1) + ' U</b></div>' +
      '<div class="brow"><span class="muted">Insulina activa (IOB)</span><b>−' + iob.toFixed(1) + ' U</b></div>' +
      '<div class="brow total"><span>Dosis sugerida</span><b>' + total.toFixed(1) + ' U</b></div>' +
      warn +
      '<p class="tiny muted" style="margin-top:8px">Cálculo orientativo. Verifica siempre con tu equipo sanitario y las instrucciones de tu dispositivo.</p>';
    out.classList.add('show');
  },

  /* ---------------- SALUD / PANEL METABÓLICO ---------------- */
  renderSalud() {
    const p = S.profile, isT2 = p.type === 'dt2';
    const st = tirStats(S.glucose, 14);
    const metrics = S.metrics.slice().sort((a, b) => a.t - b.t);
    const lastM = metrics[metrics.length - 1];
    const h = p.height / 100;
    const imc = lastM && h ? lastM.weight / (h * h) : null;
    const imcCat = imc ? (imc < 18.5 ? ['Bajo peso', 'warn'] : imc < 25 ? ['Normopeso', 'ok'] : imc < 30 ? ['Sobrepeso', 'warn'] : ['Obesidad', 'bad']) : null;
    const cut90 = Date.now() - 90 * 864e5;
    const wSeries = metrics.filter(m => m.t >= cut90 && m.weight).map(m => ({ t: m.t, v: m.weight }));
    const sysSeries = metrics.filter(m => m.t >= cut90 && m.sys).map(m => ({ t: m.t, v: m.sys }));
    const diaSeries = metrics.filter(m => m.t >= cut90 && m.dia).map(m => ({ t: m.t, v: m.dia }));
    const week = Date.now() - 7 * 864e5;
    const actCount = S.events.filter(e => e.t >= week && e.type === 'ejercicio').length;
    const actMin = actCount * 40;
    const adh = adherence7();

    const tags = [['ayunas', 'Ayunas'], ['pre', 'Pre'], ['post', 'Post'], ['aleatoria', 'Aleat.']];
    const tagVals = tags.map(t => {
      const v = S.glucose.filter(r => r.tag === t[0]).map(r => r.v);
      return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : 0;
    });
    const tagColors = tagVals.map(v => v ? bgColor(v) : 'var(--line)');

    const rows = [
      { ic: '🩸', label: 'Glucemia media', val: st.n ? st.mean + ' mg/dL' : '—', tgt: '80–130 mg/dL', s: st.n ? (st.mean >= 80 && st.mean <= 130 ? 'ok' : st.mean <= 180 ? 'warn' : 'bad') : 'na' },
      { ic: '📊', label: 'GMI (HbA1c estimada)', val: st.n ? st.gmi + ' %' : '—', tgt: '< ' + p.goals.hba1c + ' %', s: st.n ? (st.gmi <= p.goals.hba1c ? 'ok' : st.gmi <= p.goals.hba1c + 1 ? 'warn' : 'bad') : 'na' },
      { ic: '⏱️', label: 'Tiempo en rango', val: st.n ? Math.round(st.inr) + ' %' : '—', tgt: '> 70 %', s: st.n ? (st.inr >= 70 ? 'ok' : st.inr >= 50 ? 'warn' : 'bad') : 'na' },
      { ic: '⚖️', label: 'Peso', val: lastM ? lastM.weight + ' kg' : '—', tgt: '≤ ' + p.goals.weight + ' kg', s: lastM ? (lastM.weight <= p.goals.weight ? 'ok' : lastM.weight <= p.goals.weight + 3 ? 'warn' : 'bad') : 'na' },
      { ic: '📏', label: 'Perímetro abdominal', val: lastM && lastM.waist ? lastM.waist + ' cm' : '—', tgt: '< ' + p.goals.waist + ' cm', s: lastM && lastM.waist ? (lastM.waist < p.goals.waist ? 'ok' : lastM.waist < p.goals.waist + 6 ? 'warn' : 'bad') : 'na' },
      { ic: '❤️', label: 'Tensión arterial', val: lastM && lastM.sys ? lastM.sys + '/' + lastM.dia : '—', tgt: '< ' + p.goals.sys + '/' + p.goals.dia, s: lastM && lastM.sys ? (lastM.sys < p.goals.sys && lastM.dia < p.goals.dia ? 'ok' : lastM.sys < p.goals.sys + 15 ? 'warn' : 'bad') : 'na' },
      { ic: '🏃', label: 'Actividad (7 días)', val: actMin + ' min', tgt: '≥ ' + p.goals.activity + ' min', s: actMin >= p.goals.activity ? 'ok' : actMin >= p.goals.activity / 2 ? 'warn' : 'bad' }
    ];

    const SCREEN = [
      ['eye', '👁️', 'Fondo de ojo', 'Cribado de retinopatía diabética'],
      ['kidney', '🧪', 'Microalbuminuria', 'Cribado de nefropatía diabética'],
      ['foot', '🦶', 'Exploración del pie', 'Neuropatía y vasculopatía periférica'],
      ['lipids', '💧', 'Perfil lipídico', 'Riesgo cardiovascular']
    ];

    let html = '<div class="page">' +
      '<div class="page-h"><h2>Salud</h2><p>' + (isT2 ? 'Panel metabólico y prevención de complicaciones' : 'Panel de control y seguimiento') + '</p></div>';

    html += '<div class="card">' +
      '<div class="row" style="margin-bottom:6px"><h3 style="font-size:15px">Semáforo de control</h3><span class="tiny muted">Objetivos personalizables</span></div>' +
	          '<div class="card">' +
          '<h3 style="font-size:15px;margin-bottom:10px">Módulos</h3>' +
          '<div class="field"><label>Calculador de bolo</label>' +
            '<div class="seg">' +
              '<button class="seg-b ' + (!mod('bolus') ? 'on' : '') + '" onclick="App.setModule(\'bolus\',false)">Desactivado</button>' +
              '<button class="seg-b ' + (mod('bolus') ? 'on' : '') + '" onclick="App.setModule(\'bolus\',true)">Activado</button>' +
            '</div>' +
            '<p class="tiny muted" style="margin-top:6px">Actívalo si usas insulina, aunque tu diagnóstico sea de tipo 2. Requiere validar los parámetros con tu equipo sanitario.</p>' +
          '</div>' +
        '</div>' +

      rows.map(r =>
        '<div class="metric-row">' +
          '<div class="metric-ic">' + r.ic + '</div>' +
          '<div class="metric-b"><b>' + r.label + '</b><span>Objetivo: ' + r.tgt + '</span></div>' +
          '<div class="metric-v ' + (r.s === 'ok' ? 'ok' : r.s === 'warn' ? 'warn' : r.s === 'bad' ? 'bad' : 'muted') + '">' + r.val +
            '<small>' + (r.s === 'ok' ? '✓ En objetivo' : r.s === 'warn' ? '! Revisar' : r.s === 'bad' ? '▲ Fuera' : 'Sin datos') + '</small>' +
          '</div>' +
        '</div>').join('') +
      '<button class="btn ghost" style="margin-top:12px" onclick="App.modalGoals()">Ajustar objetivos</button>' +
    '</div>';

    if (imc) {
      html += '<div class="card">' +
        '<div class="row"><h3 style="font-size:15px">Índice de masa corporal</h3><span class="tag ' + imcCat[1] + '">' + imcCat[0] + '</span></div>' +
        '<div style="display:flex;align-items:baseline;gap:8px;margin-top:8px"><b style="font-size:34px;letter-spacing:-.04em">' + imc.toFixed(1) + '</b><span class="small muted">kg/m²</span></div>' +
        '<div class="bar" style="margin-top:10px"><i style="width:' + clamp((imc - 15) / 25 * 100, 2, 100) + '%;background:' + (imcCat[1] === 'ok' ? 'var(--inr)' : imcCat[1] === 'warn' ? 'var(--high)' : 'var(--low)') + '"></i></div>' +
        '<div style="display:flex;justify-content:space-between;margin-top:6px" class="tiny muted"><span>15</span><span>18,5</span><span>25</span><span>30</span><span>40</span></div>' +
        '<p class="tiny muted" style="margin-top:8px">El IMC es orientativo: no distingue masa muscular de grasa. El perímetro abdominal es mejor indicador de riesgo cardiometabólico.</p>' +
      '</div>';
    }

    html += '<div class="card"><h3 style="font-size:15px;margin-bottom:8px">Evolución del peso · 90 días</h3>' +
      seriesChart([{ name: 'Peso', color: '#0d9488', points: wSeries }]) + '</div>';

    html += '<div class="card"><h3 style="font-size:15px;margin-bottom:8px">Tensión arterial · 90 días</h3>' +
      seriesChart([
        { name: 'Sistólica', color: '#ef4444', points: sysSeries },
        { name: 'Diastólica', color: '#6366f1', points: diaSeries }
      ]) +
      '<div class="legend"><div><span class="dot" style="background:#ef4444"></span>Sistólica</div><div><span class="dot" style="background:#6366f1"></span>Diastólica</div></div></div>';

    html += '<div class="card"><h3 style="font-size:15px;margin-bottom:8px">Glucemia media por momento del día</h3>' +
      barChart(tags.map(t => t[1]), tagVals, tagColors) +
      '<p class="tiny muted" style="margin-top:6px">La glucemia postprandial elevada es un marcador de riesgo cardiovascular en la DT2.</p></div>';

    html += '<div class="card">' +
      '<div class="row" style="margin-bottom:6px"><h3 style="font-size:15px">Cribado de complicaciones</h3></div>' +
      SCREEN.map(s => {
        const t = S.screening[s[0]];
        const d = t ? daysAgo(t) : null;
        const stt = d === null ? 'bad' : d <= 365 ? 'ok' : 'warn';
        const txt = d === null ? 'Sin registrar' : d === 0 ? 'Hoy' : 'Hace ' + d + ' días';
        return '<div class="screen-item">' +
          '<div class="si">' + s[1] + '</div>' +
          '<div class="sb"><b>' + s[2] + '</b><span>' + s[3] + '</span></div>' +
          '<span class="tag ' + stt + '">' + txt + '</span>' +
          '<button class="btn sm ghost" onclick="App.markScreen(\'' + s[0] + '\')">✓</button>' +
        '</div>';
      }).join('') +
      '<p class="tiny muted" style="margin-top:10px">Recomendación general: revisión anual. Marca cada cribado cuando te lo realicen en consulta.</p>' +
    '</div>';

    if (adh !== null) {
      html += '<div class="card">' +
        '<div class="row"><h3 style="font-size:15px">Adherencia a la medicación</h3><b style="font-size:20px" class="' + (adh >= 80 ? 'ok' : adh >= 50 ? 'warn' : 'bad') + '">' + adh + '%</b></div>' +
        '<div class="bar" style="margin-top:10px"><i style="width:' + adh + '%;background:' + (adh >= 80 ? 'var(--inr)' : adh >= 50 ? 'var(--high)' : 'var(--low)') + '"></i></div>' +
        '<p class="tiny muted" style="margin-top:8px">Calculada sobre los últimos 7 días y ' + S.meds.length + ' recordatorio(s). Registra cada toma desde la pantalla de inicio.</p>' +
      '</div>';
    }

    if (!isT2) {
      const cut14 = Date.now() - 14 * 864e5;
      const hypos = S.glucose.filter(r => r.t >= cut14 && r.v < 70).length;
      const ket = S.events.filter(e => e.t >= cut14 && e.type === 'cetonas').length;
      html += '<div class="card">' +
        '<h3 style="font-size:15px;margin-bottom:8px">Hipoglucemias y cetonas · 14 días</h3>' +
        '<div class="stats">' +
          '<div class="stat"><b class="' + (hypos > 3 ? 'bad' : 'ok') + '">' + hypos + '</b><span>Lecturas &lt; 70 mg/dL</span></div>' +
          '<div class="stat"><b>' + ket + '</b><span>Registros de cetonas</span></div>' +
        '</div>' +
        '<p class="tiny muted" style="margin-top:10px">Más de 3 hipoglucemias en 14 días es un criterio para revisar el tratamiento con tu equipo sanitario.</p>' +
      '</div>';
    }

    html += '<div class="card">' +
      '<h3 style="font-size:15px;margin-bottom:8px">El plato saludable</h3>' + plateSVG() +
      '<p class="tiny muted" style="margin-top:10px">Reparto orientativo para comida y cena. Ajusta las raciones de hidratos según tu pauta.</p>' +
    '</div>';

    html += '</div>';
    return html;
  },

  markScreen(k) {
    S.screening[k] = Date.now();
    save(); this.render(); toast('Cribado registrado');
  },

  modalGoals() {
    const g = S.profile.goals;
    this.modal('Objetivos personalizados',
      '<p class="small muted" style="margin-bottom:12px">Estos valores los define tu equipo sanitario. Se usan para el semáforo de control.</p>' +
      '<div class="grid2">' +
        '<div class="field"><label>HbA1c objetivo (%)</label><input class="input" id="gA1c" type="number" step="0.1" value="' + g.hba1c + '"></div>' +
        '<div class="field"><label>Peso objetivo (kg)</label><input class="input" id="gW" type="number" value="' + g.weight + '"></div>' +
        '<div class="field"><label>Perímetro (cm)</label><input class="input" id="gWaist" type="number" value="' + g.waist + '"></div>' +
        '<div class="field"><label>Actividad (min/sem)</label><input class="input" id="gAct" type="number" value="' + g.activity + '"></div>' +
        '<div class="field"><label>TAS (mmHg)</label><input class="input" id="gSys" type="number" value="' + g.sys + '"></div>' +
        '<div class="field"><label>TAD (mmHg)</label><input class="input" id="gDia" type="number" value="' + g.dia + '"></div>' +
      '</div>',
      '<button class="btn ghost" onclick="App.closeModal()">Cancelar</button>' +
      '<button class="btn primary" onclick="App.saveGoals()">Guardar</button>');
  },
  saveGoals() {
    const g = S.profile.goals;
    g.hba1c = parseFloat($('#gA1c').value) || 7;
    g.weight = parseFloat($('#gW').value) || 75;
    g.waist = parseFloat($('#gWaist').value) || 90;
    g.activity = parseFloat($('#gAct').value) || 150;
    g.sys = parseFloat($('#gSys').value) || 130;
    g.dia = parseFloat($('#gDia').value) || 80;
    save(); this.closeModal(); this.render(); toast('Objetivos actualizados');
  },

        '<button class="btn ghost" style="margin-top:12px" onclick="App.modalLabel()">Cómo leer una etiqueta en 6 pasos</button>' +

  /* ---------------- INFORMES ---------------- */
  renderReports() {

      { v: st.vlow, c: '#b91c1c' }, { v: st.low, c: '#ef4444' },
      { v: st.inr, c: '#16a34a' }, { v: st.high, c: '#f59e0b' }, { v: st.vhigh, c: '#ea580c' }
    ];
    return '<div class="page">' +
      '<div class="page-h"><h2>Informes</h2><p>Perfil Ambulatorio de Glucosa (AGP) · últimos 14 días</p></div>' +
      '<div class="card">' +
        '<div style="display:flex;align-items:center;gap:16px">' +
          '<div class="donut-wrap">' + donut(segs, 120, 14) + '<div class="donut-c"><b>' + Math.round(st.inr) + '%</b><span>TIR</span></div></div>' +
          '<div style="flex:1">' +
            '<div class="brow"><span class="muted">Lecturas</span><b>' + st.n + '</b></div>' +
            '<div class="brow"><span class="muted">Glucosa media</span><b>' + st.mean + ' mg/dL</b></div>' +
            '<div class="brow"><span class="muted">GMI (HbA1c est.)</span><b>' + st.gmi + '%</b></div>' +

          '</div>' +
        '</div>' +
        '<div class="stats" style="margin-top:14px">' +
          '<div class="stat"><b style="color:#b91c1c">' + Math.round(st.vlow) + '%</b><span>Muy bajo &lt;54</span></div>' +
          '<div class="stat"><b style="color:#ef4444">' + Math.round(st.low) + '%</b><span>Bajo 54–69</span></div>' +
          '<div class="stat"><b style="color:#16a34a">' + Math.round(st.inr) + '%</b><span>En rango 70–180</span></div>' +

          '<div class="stat"><b style="color:#ea580c">' + Math.round(st.vhigh) + '%</b><span>Muy alto &gt;250</span></div>' +

    $('#printArea').innerHTML =
      '<div class="pr-page">' +
        '<div class="pr-h"><h1>GlucoLuz · Informe AGP</h1>' +

        '<p style="font-size:12px"><b>Paciente:</b> ' + esc(p.name || 'No indicado') + ' &nbsp;·&nbsp; <b>Tipo:</b> ' + (p.type === 'dt1' ? 'Diabetes tipo 1' : 'Diabetes tipo 2') + ' &nbsp;·&nbsp; <b>Peso:</b> ' + p.weight + ' kg &nbsp;·&nbsp; <b>Altura:</b> ' + p.height + ' cm</p>' +
        '<div class="pr-grid">' +
          '<div class="pr-cell"><b>' + Math.round(st.inr) + '%</b><span>TIR 70–180</span></div>' +

  shareReport() {
    const st = tirStats(S.glucose, 14);
    const txt = 'GlucoLuz · Resumen 14 días\n' +
      'TIR (70-180): ' + Math.round(st.inr) + '%\n' +
      'Glucosa media: ' + st.mean + ' mg/dL\n' +
      'GMI estimada: ' + st.gmi + '%\n' +
      'Variabilidad CV: ' + st.cv + '%\n' +
      'Lecturas: ' + st.n;
    if (navigator.share) {
      navigator.share({ title: 'GlucoLuz · Resumen', text: txt }).catch(() => {});

  exportData() {

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);

  importData() { $('#importFile').click(); },
  handleImport(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const d = JSON.parse(e.target.result);
        if (!d || typeof d !== 'object' || !d.profile) throw new Error('formato');
        if (!confirm('Se sustituirán todos los datos actuales por los de la copia. ¿Continuar?')) return;
        localStorage.setItem(KEY, JSON.stringify(d));
        S = loadState();
        this.renderTabbar(); this.go('home');
        toast('Copia restaurada correctamente');
      } catch (err) {
        toast('Archivo no válido');
      }
    };
    reader.readAsText(file);
    input.value = '';
  },

  resetAll() {

saveInsulin() {

  if (!S.insulin) S.insulin = [];
  const t = Date.now();
  if (rap > 0) S.insulin.push({ id: uid(), t, v: rap, type: 'rapida', slot });
  if (len > 0) S.insulin.push({ id: uid(), t, v: len, type: 'lenta', slot });
  save(); this.closeModal(); this.render();
  toast('Insulina registrada');
},

    modalScanner() {
      this.modal('Escanear código de barras',
        '<div class="scan-wrap">' +
          '<video id="scanVideo" playsinline muted autoplay></video>' +
          '<div class="scan-frame"></div>' +

        '</div>' +
        '<p class="small muted" id="scanStatus" style="text-align:center;margin-bottom:12px">Preparando la cámara…</p>' +
        '<div class="alert i">El escáner consulta la base de datos abierta <b>Open Food Facts</b>. Necesita conexión a internet y permiso de cámara (solo funciona en HTTPS o localhost).</div>',
        '<button class="btn ghost" onclick="App.closeModal()">Cerrar</button>' +
        '<button class="btn primary" onclick="App.modalManualCode()">Introducir código</button>');
      setTimeout(() => this.startScan(), 120);
    },

    async startScan() {
      const video = $('#scanVideo');
      const status = $('#scanStatus');
      if (!video || !status) return;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        status.textContent = 'Este navegador no permite acceder a la cámara. Usa la entrada manual.';
        return;
      }
      try {
        status.textContent = 'Solicitando permiso de cámara…';
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        this._stream = stream;
        video.srcObject = stream;
        try { await video.play(); } catch (e) {}
        status.textContent = 'Apunta al código de barras del producto…';

        /* 1) API nativa BarcodeDetector (Chrome, Edge, Android) */
        if ('BarcodeDetector' in window) {
          try {
            const formats = await window.BarcodeDetector.getSupportedFormats();
            const want = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'itf'].filter(f => formats.indexOf(f) >= 0);
            if (want.length) {
              const detector = new window.BarcodeDetector({ formats: want });
              this._detector = detector;
              const tick = async () => {
                if (!this._detector || !this._stream) return;
                try {
                  const codes = await detector.detect(video);
                  if (codes && codes.length) { this.onScanResult(codes[0].rawValue); return; }
                } catch (e) {}
                this._rafId = requestAnimationFrame(tick);
              };
              this._rafId = requestAnimationFrame(tick);
              return;
            }
          } catch (e) {}
        }

        /* 2) ZXing como alternativa (iOS Safari, Firefox) */
        status.textContent = 'Cargando lector alternativo…';
        const ZX = await this.loadZXing();
        const reader = new ZX.BrowserMultiFormatReader();
        this._reader = reader;
        const cb = (result) => { if (result) this.onScanResult(result.getText()); };
        if (typeof reader.decodeFromStream === 'function') reader.decodeFromStream(stream, video, cb);
        else reader.decodeFromVideoElement(video, cb);
        status.textContent = 'Apunta al código de barras del producto…';
      } catch (err) {
        const m = err && err.name;
        if (m === 'NotAllowedError' || m === 'SecurityError') status.textContent = 'Permiso de cámara denegado. Actívalo en los ajustes del navegador.';
        else if (m === 'NotFoundError' || m === 'OverconstrainedError') status.textContent = 'No se ha encontrado ninguna cámara disponible.';
        else status.textContent = 'No se pudo iniciar la cámara. Usa la entrada manual.';
      }
    },

    loadZXing() {
      if (window.ZXing) return Promise.resolve(window.ZXing);
      if (this._zxingPromise) return this._zxingPromise;
      this._zxingPromise = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
        s.onload = () => window.ZXing ? resolve(window.ZXing) : reject(new Error('ZXing no disponible'));
        s.onerror = () => reject(new Error('No se pudo cargar el lector'));
        document.head.appendChild(s);
      });
      return this._zxingPromise;
    },

    stopScan() {
      if (this._rafId) { cancelAnimationFrame(this._rafId); this._rafId = null; }
      this._detector = null;
      if (this._reader) { try { this._reader.reset(); } catch (e) {} this._reader = null; }
      if (this._stream) { try { this._stream.getTracks().forEach(t => t.stop()); } catch (e) {} this._stream = null; }
      const v = $('#scanVideo');
      if (v) { try { v.srcObject = null; } catch (e) {} }
    },

    onScanResult(code) {
      if (!code || this._scanning) return;
      this._scanning = true;
      const clean = String(code).replace(/[^0-9A-Za-z]/g, '');
      this.stopScan();
      if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) {} }
      this.lookupBarcode(clean);
    },

    async lookupBarcode(code) {
      this.modal('Consultando Open Food Facts',
        '<div style="text-align:center;padding:28px 0">' +
          '<div style="font-size:36px">🔎</div>' +
          '<p class="small muted" style="margin-top:12px">Buscando el código <b>' + esc(code) + '</b>…</p>' +
        '</div>');
      try {
        const p = await offLookup(code);
        if (!p) { this.notFound(code); return; }
        this.showProduct(p, code);
      } catch (e) {
        this.modal('No se pudo consultar',
          '<div class="alert d">No se ha podido conectar con Open Food Facts. Comprueba tu conexión a internet.</div>' +
          '<p class="small muted" style="margin-top:10px">El escáner necesita conexión para consultar la base de datos. También puedes crear el alimento a mano con los datos de la etiqueta.</p>',
          '<button class="btn ghost" onclick="App.closeModal()">Cerrar</button>' +
          '<button class="btn primary" onclick="App.modalNewFood(\'' + esc(code) + '\')">Crear a mano</button>');
      } finally {
        this._scanning = false;
      }
    },

    notFound(code) {
      this.modal('Producto no encontrado',
        '<div class="alert w">El código <b>' + esc(code) + '</b> no está registrado en Open Food Facts.</div>' +
        '<p class="small muted" style="margin-top:10px">Puede tratarse de un producto local, artesanal o de reciente lanzamiento. Puedes crearlo a mano con los datos de la etiqueta y quedará guardado en «Mis alimentos».</p>',
        '<button class="btn ghost" onclick="App.closeModal()">Cerrar</button>' +
        '<button class="btn primary" onclick="App.modalNewFood(\'' + esc(code) + '\')">Crear alimento</button>');
    },

    showProduct(p, code) {
      const n = p.nutriments || {};
      const sugars = numOrNull(n.sugars_100g);
      const fat = numOrNull(n['fat_100g']);
      const sat = numOrNull(n['saturated-fat_100g']);
      const salt = numOrNull(n['salt_100g']);
      const fiber = numOrNull(n['fiber_100g']);
      const carbs = numOrNull(n.carbohydrates_100g);
      const prot = numOrNull(n['proteins_100g']);
      const kcal = numOrNull(n['energy-kcal_100g']);
      const name = p.product_name_es || p.product_name || 'Producto sin nombre';
      const brand = (p.brands || '').split(',')[0].trim();
      const ns = (p.nutriscore_grade || '').toLowerCase();
      const img = p.image_front_small_url || '';

      const light = (v, lo, mid, invert) => {
        if (v === null) return 'na';
        if (invert) return v >= lo ? 'ok' : v >= mid ? 'warn' : 'bad';
        return v <= lo ? 'ok' : v <= mid ? 'warn' : 'bad';
      };
      const fmt = v => v === null ? '—' : (Math.round(v * 10) / 10).toString().replace('.', ',') + ' g';

      const rows = [
        ['Azúcares', fmt(sugars), light(sugars, 5, 22.5, false)],
        ['Grasas totales', fmt(fat), light(fat, 3, 20, false)],
        ['Grasas saturadas', fmt(sat), light(sat, 1.5, 5, false)],
        ['Sal', fmt(salt), light(salt, 0.3, 1.5, false)],
        ['Fibra', fmt(fiber), light(fiber, 6, 3, true)],
        ['Hidratos totales', fmt(carbs), 'na'],
        ['Proteínas', fmt(prot), 'na']
      ];

      const food = {
        id: 'off_' + code,
        n: name + (brand ? ' · ' + brand : ''),
        cat: 'Mis alimentos',
        gi: -1,
        c: carbs === null ? 0 : Math.round(carbs * 10) / 10,
        por: 100,
        pl: '100 g',
        custom: true,
        barcode: code,
        brand: brand,
        image: img,
        nutriscore: ns || null
      };
      this._scannedFood = food;

      this.modal('Producto escaneado',
        '<div class="prod-head">' +
          (img ? '<img class="prod-img" src="' + esc(img) + '" alt="" onerror="this.style.display=\'none\'">' : '<div class="prod-img" style="display:grid;place-items:center;font-size:24px">🥫</div>') +
          '<div style="flex:1;min-width:0">' +
            '<b style="font-size:15px;display:block;line-height:1.3">' + esc(name) + '</b>' +
            '<span class="small muted">' + esc(brand || 'Marca no indicada') + (p.quantity ? ' · ' + esc(p.quantity) : '') + '</span>' +
          '</div>' +
          (ns && NUTRI_COLORS[ns] ? '<div class="ns-badge" style="background:' + NUTRI_COLORS[ns] + '" title="Nutri-Score">' + ns.toUpperCase() + '</div>' : '') +
        '</div>' +
        '<p class="tiny muted" style="margin-bottom:8px">Valores por 100 g' + (kcal !== null ? ' · ' + Math.round(kcal) + ' kcal' : '') + (p.nova_group ? ' · NOVA ' + p.nova_group : '') + '</p>' +
        rows.map(r =>
          '<div class="nutri-line"><b>' + r[0] + '</b>' +
            '<span style="display:flex;align-items:center;gap:8px"><span class="muted">' + r[1] + '</span>' +
            '<span class="tag ' + r[2] + '">' + (r[2] === 'ok' ? '✓' : r[2] === 'warn' ? '!' : r[2] === 'bad' ? '▲' : '·') + '</span></span>' +
          '</div>').join('') +
        '<div class="sep"></div>' +
        '<div class="field"><label>Cantidad que vas a consumir (g)</label>' +
          '<input class="input" id="scanGrams" type="number" value="' + food.por + '"></div>' +
        '<p class="tiny muted">Aportará aproximadamente <b id="scanCarbs">' + food.c + '</b> g de hidratos.</p>' +
        (p.ingredients_text_es ? '<div class="sep"></div><p class="tiny muted" style="line-height:1.5"><b>Ingredientes:</b> ' + esc(p.ingredients_text_es.slice(0, 400)) + '</p>' : '') +
        '<p class="tiny muted" style="margin-top:10px">Datos de Open Food Facts (licencia ODbL). Pueden contener errores: verifica siempre con el etiquetado del envase.</p>',
        '<button class="btn ghost" onclick="App.saveScanned()">Guardar</button>' +
        '<button class="btn primary" onclick="App.addScanned()">Añadir a la comida</button>');

      const gi = $('#scanGrams');
      if (gi) gi.addEventListener('input', () => {
        const g = parseFloat(gi.value) || 0;
        const el = $('#scanCarbs');
        if (el) el.textContent = (food.c * g / 100).toFixed(1);
      });
    },

    saveScanned() {
      const f = this._scannedFood;
      if (!f) return;
      const i = S.customFoods.findIndex(x => x.id === f.id);
      if (i >= 0) S.customFoods[i] = f; else S.customFoods.unshift(f);
      save();
      this.closeModal();
      toast('Guardado en Mis alimentos');
    },

    addScanned() {
      const f = this._scannedFood;
      if (!f) return;
      const g = parseFloat(($('#scanGrams') || {}).value) || 100;
      const i = S.customFoods.findIndex(x => x.id === f.id);
      if (i >= 0) S.customFoods[i] = f; else S.customFoods.unshift(f);
      save();
      const ex = this.cart.find(c => c.id === f.id);
      if (ex) ex.g += g; else this.cart.push({ id: f.id, g });
      this.closeModal();
      this.go('meals');
      toast(f.n + ' añadido · ' + (f.c * g / 100).toFixed(1) + ' g de HC');
    },

    modalManualCode() {
      this.modal('Introducir código manualmente',
        '<div class="field"><label>Código de barras (EAN-13, EAN-8, UPC)</label>' +
          '<input class="input" id="mEan" inputmode="numeric" placeholder="8410000000012"></div>' +
        '<p class="small muted">Puedes probar con el código real de cualquier producto de tu despensa.</p>',
        '<button class="btn ghost" onclick="App.closeModal()">Cerrar</button>' +
        '<button class="btn primary" onclick="App.scanCode()">Buscar</button>');
    },

    scanCode() {
      const code = ($('#mEan').value || '').replace(/[^0-9A-Za-z]/g, '');
      if (code.length < 6) { toast('Introduce un código válido'); return; }
      this.lookupBarcode(code);
    },

    modalNewFood(code) {
      this.modal('Nuevo alimento',
        '<div class="field"><label>Nombre</label><input class="input" id="nfName" placeholder="Ej. Yogur de coco"></div>' +
        '<div class="field"><label>Marca (opcional)</label><input class="input" id="nfBrand"></div>' +
        '<div class="grid2">' +
          '<div class="field"><label>Hidratos (g/100 g)</label><input class="input" id="nfCarbs" type="number" step="0.1" placeholder="12"></div>' +
          '<div class="field"><label>Índice glucémico</label><input class="input" id="nfGi" type="number" placeholder="55"></div>' +
        '</div>' +
        '<div class="field"><label>Ración habitual (g)</label><input class="input" id="nfPor" type="number" value="100"></div>' +
        (code ? '<p class="tiny muted">Código de barras: ' + esc(code) + '</p>' : '<p class="tiny muted">Si dejas el índice glucémico vacío se usará un valor medio de 55 para el cálculo de la carga glucémica.</p>'),
        '<button class="btn ghost" onclick="App.closeModal()">Cancelar</button>' +
        '<button class="btn primary" onclick="App.saveNewFood(\'' + esc(code || '') + '\')">Guardar</button>');
    },

    saveNewFood(code) {
      const name = ($('#nfName').value || '').trim();
      if (!name) { toast('Indica el nombre del alimento'); return; }
      const carbs = parseFloat($('#nfCarbs').value);
      if (isNaN(carbs)) { toast('Indica los hidratos por 100 g'); return; }
      const giRaw = parseFloat($('#nfGi').value);
      const brand = ($('#nfBrand').value || '').trim();
      const f = {
        id: code ? 'off_' + code : 'c_' + uid(),
        n: name + (brand ? ' · ' + brand : ''),
        cat: 'Mis alimentos',
        gi: isNaN(giRaw) ? -1 : giRaw,
        c: Math.round(carbs * 10) / 10,
        por: parseFloat($('#nfPor').value) || 100,
        pl: '100 g',
        custom: true,
        barcode: code || null
      };
      const i = S.customFoods.findIndex(x => x.id === f.id);
      if (i >= 0) S.customFoods[i] = f; else S.customFoods.unshift(f);
      save();
      this.closeModal();
      this.go('meals');
      toast('Guardado en Mis alimentos');
    },


  modalEdu(k) {
    const content = {
      plato: ['🍽️ El método del plato', 'Divide el plato en tres partes: la mitad para verduras y hortalizas, un cuarto para proteínas (pescado, huevo, legumbres, carne magra) y un cuarto para hidratos de carbono integrales. Este patrón mejora el control glucémico y la saciedad sin necesidad de pesar cada alimento.'],
      ig: ['📉 Índice glucémico y carga glucémica', 'El índice glucémico (IG) mide la velocidad con la que un alimento sube la glucemia; la carga glucémica (IG × hidratos / 100) tiene en cuenta además la cantidad. Un alimento con IG alto en ración pequeña puede tener carga baja. Combina hidratos con fibra, proteína y grasa para aplanar la curva.'],
      hipo: ['⚠️ Hipoglucemias', 'Si tu glucosa baja de 70 mg/dL, aplica la regla 15-15: toma 15 g de hidrato rápido (un vaso de zumo, 3 terrones de azúcar o una tableta de glucosa), espera 15 minutos y vuelve a medir. Repite si sigue baja. Si hay pérdida de consciencia, no des nada por boca y llama al 112.'],
      hiper: ['📈 Hiperglucemias y cetonas', 'Ante una glucemia superior a 250 mg/dL, hidrátate con agua, evita el ejercicio intenso y comprueba cetonas si tienes diabetes tipo 1 o usas insulina. Cetonas moderadas o altas con malestar, vómitos o dolor abdominal son una urgencia: contacta con tu equipo o acude a urgencias.'],
      ejercicio: ['🏃 Ejercicio y glucemia', 'El ejercicio aeróbico (caminar, nadar, bicicleta) tiende a bajar la glucemia y puede hacerlo hasta 24 horas después. El ejercicio de fuerza puede subirla de forma transitoria. Mide antes, durante y después, lleva hidratos de acción rápida y ajusta con tu equipo según el tipo, la intensidad y la duración.'],
      enfermedad: ['🤒 Días de enfermedad', 'Cualquier infección, fiebre o cirugía eleva la glucemia. Reglas básicas: nunca suspendas la insulina basal, mide cada 3-4 horas, hidrátate, comprueba cetonas y consulta si la glucemia supera 250-300 mg/dL de forma mantenida, hay vómitos o no puedes mantener la hidratación.'],
      pies: ['🦶 Cuidado de los pies', 'Explora tus pies a diario buscando heridas, ampollas, enrojecimiento o cambios de color. Hidrata la piel pero no entre los dedos. Usa calzado ancho y sin costuras internas, y nunca camines descalzo. Acude a revisión profesional al menos una vez al año.'],
      analitica: ['🧪 Interpretar tu analítica', 'La HbA1c refleja la glucosa media de los últimos 2-3 meses (objetivo habitual <7%, individualizable). El perfil lipídico valora el riesgo cardiovascular: LDL, HDL y triglicéridos. La creatinina y el filtrado glomerular estiman la función renal, y el cociente albúmina/creatinina detecta daño renal precoz.']
    }[k];
         this.modal(content[0], '<p class="small" style="line-height:1.65">' + content[1] + '</p>', '<button class="btn primary" onclick="App.closeModal()">Entendido</button>');
    },

    modalLabel() {
      const steps = [
        ['Mira la columna «por 100 g»', 'Nunca compares usando «por ración»: los fabricantes ajustan el tamaño de la ración para que las cifras parezcan pequeñas.'],
        ['Compara productos similares', 'Dos yogures, dos panes, dos galletas. El semáforo de la pantalla anterior te da los umbrales por 100 g.'],
        ['Lee la lista de ingredientes', 'Van ordenados de mayor a menor cantidad. Si el azúcar aparece entre los tres primeros, el producto es alto en azúcar.'],
        ['Detecta los azúcares ocultos', 'Un mismo producto puede llevar tres o cuatro formas distintas de azúcar para que ninguna destaque en la lista.'],
        ['Calcula la sal a partir del sodio', 'Sal (g) = sodio (g) × 2,5. El objetivo es no superar 5 g de sal al día en el total de la dieta.'],
        ['Revisa las grasas', 'Evita cualquier producto con «grasas parcialmente hidrogenadas» en la lista: son grasas trans. Prioriza aceite de oliva, frutos secos y pescado.']
      ];
      this.modal('Cómo leer una etiqueta en 6 pasos',
        '<div class="steps">' + steps.map((s, i) =>
          '<div class="step"><div class="sn">' + (i + 1) + '</div><div><b>' + s[0] + '</b><span>' + s[1] + '</span></div></div>').join('') + '</div>' +
        '<div class="sep"></div>' +
        '<p class="small" style="font-weight:700;margin-bottom:6px">Azúcares que aparecen con otros nombres</p>' +
        '<div style="display:flex;flex-wrap:wrap;gap:6px">' + SUGAR_ALIASES.map(a => '<span class="tag warn">' + a + '</span>').join('') + '</div>' +
        '<div class="sep"></div>' +
        '<p class="small" style="font-weight:700;margin-bottom:6px">Cuidado con estas afirmaciones</p>' +
        '<div class="edu">' +
          '<div class="edu-item"><b>«Sin azúcares añadidos»</b><span>No significa que no tenga azúcar: puede contener azúcares naturalmente presentes (lactosa, fructosa del zumo concentrado).</span></div>' +
          '<div class="edu-item"><b>«Sin azúcar»</b><span>Legalmente significa ≤ 0,5 g de azúcar por 100 g o 100 ml. Puede seguir teniendo hidratos y muchas calorías.</span></div>' +
          '<div class="edu-item"><b>«Light» o «bajo en…»</b><span>Implica una reducción de al menos el 30 % respecto al producto original, que puede seguir siendo alto.</span></div>' +
          '<div class="edu-item"><b>«0 % materia grasa»</b><span>Muy habitual que se compense añadiendo azúcar o almidones. Lee siempre la tabla.</span></div>' +
        '</div>',
        '<button class="btn primary" onclick="App.closeModal()">Entendido</button>');
    },

    modalSweeteners() {
      this.modal('Edulcorantes: lo que dice la evidencia',
        '<p class="small" style="line-height:1.65;margin-bottom:12px">La <b>ingesta diaria admisible (IDA)</b> es la cantidad que puede consumirse a diario durante toda la vida sin riesgo apreciable. Para un adulto de 70 kg, la IDA de aspartamo equivale a unos 2.800 mg/día, es decir, alrededor de 15 refrescos de 330 ml. Las dosis habituales quedan muy por debajo.</p>' +
        '<div class="alert w">⚠️ <b>Guía de la OMS (2023).</b> No se recomienda utilizar edulcorantes no nutritivos como estrategia para controlar el peso o reducir el riesgo de enfermedades no transmisibles. Es una recomendación condicional, basada en evidencia de certeza baja, y no se aplica a los polialcoholes.</div>' +
        '<div class="sep"></div>' +
        '<p class="small" style="font-weight:700;margin-bottom:6px">Claves para la diabetes</p>' +
        '<div class="edu">' +
          '<div class="edu-item"><b>«Sin azúcar» no es «sin hidratos»</b><span>Los polialcoholes siguen aportando hidratos: el maltitol alrededor de la mitad que la sacarosa. Cuéntalos si usas insulina.</span></div>' +
          '<div class="edu-item"><b>Lo que importa es la carga glucémica total</b><span>Un producto sin azúcar pero rico en harinas refinadas sube la glucemia igual que uno azucarado.</span></div>' +
          '<div class="edu-item"><b>El agua es siempre la mejor bebida</b><span>Ningún edulcorante mejora el perfil nutricional de una bebida: solo reduce las calorías.</span></div>' +
          '<div class="edu-item"><b>No autorizados en la UE como edulcorantes</b><span>La alulosa y el fruto del monje (luo han guo) no están autorizados en Europa; se comercializan como complementos o alimentos novedosos.</span></div>' +
        '</div>' +
        '<p class="tiny muted" style="margin-top:12px;line-height:1.5">Fuentes: evaluaciones de EFSA y JECFA, clasificación de la IARC (2023) y directriz de la OMS sobre edulcorantes no azucarados (2023). Información educativa: consulta a tu equipo sanitario antes de cambiar hábitos.</p>',
        '<button class="btn primary" onclick="App.closeModal()">Entendido</button>');
    }
  };
 

/* ---------------- ARRANQUE ---------------- */
document.addEventListener('DOMContentLoaded', () => App.init());
</script>
